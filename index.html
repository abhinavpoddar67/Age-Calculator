<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Age calculator app</title>


</head>

<body>

  <main class="Container">

    <div id="inputContainer">

      <div class="days">
        <p>Day</p>
        <input id="day" type="number" placeholder="DD">
      </div>

      <div class="months">
        <p>Month</p>
        <input id="month" type="number" placeholder="MM">
      </div>

      <div class="years">
        <p>Year</p>
        <input id="year" type="number" placeholder="YYYY">
      </div>

    </div>

    <button id="btn"><img src="./assets/images/icon-arrow.svg"></button>

    <div>
      <div id="yearOutput">-- years</div>
      <div id="monthOutput">-- months</div>
      <div id="dayOutput">-- days</div>
    </div>

  </main>

</body>

</html>
