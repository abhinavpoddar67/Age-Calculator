<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Age calculator app</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="container">

    <div id="inputContainer">

      <div class="days">
        <p>DAY</p>
        <input id="day" type="number" placeholder="DD">
      </div>

      <div class="months">
        <p>MONTH</p>
        <input id="month" type="number" placeholder="MM">
      </div>

      <div class="years">
        <p>YEAR</p>
        <input id="year" type="number" placeholder="YYYY">
      </div>

      <button id="btn"><img src="./assets/images/icon-arrow.svg"></button>

    </div>


    <div class="outputContainer">
      <div class="output"><i><span id="yearOutput">--</span> years</i></div>
      <div class="output"><i><span id="monthOutput">--</span> months</i></div>
      <div class="output"><i><span id="dayOutput">--</span> days</i></div>
    </div>

  </main>

</body>

</html>
